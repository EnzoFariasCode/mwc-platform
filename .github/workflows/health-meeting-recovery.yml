name: Recover pending Google Meet appointments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-meeting-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process pending meetings
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 240 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://www.maximusworldclick.com.br/api/cron/health-meeting-recovery"
