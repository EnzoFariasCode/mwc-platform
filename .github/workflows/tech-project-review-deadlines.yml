name: Process Tech project review deadlines

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tech-project-review-deadlines
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process review deadlines
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in GitHub Actions."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --max-time 240 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://www.maximusworldclick.com.br/api/cron/tech-project-review-deadlines"
